<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress Vite WebSocket and API Key errors in the console and UI
      (function() {
        const isBenignError = (msg) => {
          if (!msg) return false;
          const strMsg = String(msg).toLowerCase();
          return strMsg.includes('[vite]') || 
                 strMsg.includes('websocket') ||
                 strMsg.includes('fadlan geli gemini_api_key') ||
                 strMsg.includes('gemini_api_key') ||
                 strMsg.includes('firestore') ||
                 strMsg.includes('rpc \'listen\' stream') ||
                 strMsg.includes('webchannelconnection') ||
                 strMsg.includes('transport errored') ||
                 strMsg.includes('connected') ||
                 strMsg.includes('closed without opened');
        };

        const originalError = console.error;
        console.error = (...args) => {
          if (isBenignError(args[0])) return;
          originalError.apply(console, args);
        };

        const originalWarn = console.warn;
        console.warn = (...args) => {
          if (isBenignError(args[0])) return;
          originalWarn.apply(console, args);
        };
        
        window.addEventListener('unhandledrejection', (event) => {
          const msg = event.reason?.message || String(event.reason);
          if (isBenignError(msg)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', (event) => {
          if (isBenignError(event.message) || isBenignError(event.error)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
