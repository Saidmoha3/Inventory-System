<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress Vite WebSocket and API Key errors in the console
      (function() {
        const originalError = console.error;
        const originalWarn = console.warn;
        const originalLog = console.log;
        const originalDebug = console.debug;
        
        const isBenignError = (msg) => {
          if (!msg || typeof msg !== 'string') return false;
          const lowerMsg = msg.toLowerCase();
          return lowerMsg.includes('[vite]') || 
                 lowerMsg.includes('websocket') ||
                 lowerMsg.includes('fadlan geli gemini_api_key') ||
                 lowerMsg.includes('@firebase/firestore') ||
                 lowerMsg.includes('rpc \'listen\' stream');
        };

        console.error = (...args) => {
          if (isBenignError(args[0])) return;
          originalError.apply(console, args);
        };

        console.warn = (...args) => {
          if (isBenignError(args[0])) return;
          originalWarn.apply(console, args);
        };

        console.log = (...args) => {
          if (isBenignError(args[0])) return;
          originalLog.apply(console, args);
        };

        console.debug = (...args) => {
          if (isBenignError(args[0])) return;
          originalDebug.apply(console, args);
        };
        
        window.addEventListener('unhandledrejection', (event) => {
          const msg = event.reason?.message || String(event.reason);
          if (isBenignError(msg)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supermarket Pro</title>
    <meta name="description" content="Professional supermarket management system with real-time stock tracking, sales analytics, and multi-location support." />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
